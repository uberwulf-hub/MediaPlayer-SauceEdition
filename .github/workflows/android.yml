# Builds the signed release .apk (MediaPlayerSE-android.apk). Called by every Release, or run on its own from
# Actions > Android > Run workflow to get a test build.
#
# Signing (the same as Sahuarita Smash): Android only installs an update over an older copy if both were signed with
# the same key. Where the key comes from, first found:
#   1. the ANDROID_KEYSTORE_BASE64 / _ALIAS / _PASSWORD secrets, if someone set them;
#   2. keys/mediaplayerse-release.keystore.enc, the key locked with the BACKUP_PASSPHRASE secret ('Keep the Android
#      key in the repository' puts it there, from the cache, and deletes the cached copy);
#   3. only while the repository is private: the key the first build made, kept in the Actions cache.
# A public repository never uses the cache (other people's pull requests can reach it), and no unlocked key is ever
# cached or uploaded.
name: Android

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }

      - name: Which key
        id: which
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          IS_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ -n "$KEY_B64" ]; then echo "key=secrets" >> "$GITHUB_OUTPUT"
          elif [ -f keys/mediaplayerse-release.keystore.enc ] && [ -n "$PASSPHRASE" ]; then echo "key=locked" >> "$GITHUB_OUTPUT"
          elif [ -f keys/mediaplayerse-release.keystore.enc ]; then
            echo "::error::The signing key is in keys/ but the BACKUP_PASSPHRASE secret that unlocks it isn't set (pull requests from other people's copies never get it, so they can't sign)."
            exit 1
          elif [ "$IS_PRIVATE" = "true" ]; then echo "key=cache" >> "$GITHUB_OUTPUT"
          else
            echo "::error::This repository is public and has no signing key it can use: run 'Keep the Android key in the repository' first (it needs the BACKUP_PASSPHRASE secret)."
            exit 1
          fi

      # only while the repository is private and the key isn't kept anywhere else: the one the first build made
      - name: Keep the signing key between builds
        if: steps.which.outputs.key == 'cache'
        uses: actions/cache@v4
        with:
          path: ~/android-key
          key: mediaplayerse-android-signing-key-v1

      - name: Set up signing
        env:
          WHICH: ${{ steps.which.outputs.key }}
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -e
          # the unlocked key goes to the runner's temp folder, never into a cache or an upload
          if [ "$WHICH" = "secrets" ]; then
            KS="$RUNNER_TEMP/secret.keystore"
            echo "$KEY_B64" | base64 -d > "$KS"
            ALIAS="$KEY_ALIAS"; PASS="$KEY_PASS"
            echo "Using the signing key from the repository secrets."
          elif [ "$WHICH" = "locked" ]; then
            KS="$RUNNER_TEMP/release.keystore"
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in keys/mediaplayerse-release.keystore.enc -out "$KS" -pass env:PASSPHRASE
            ALIAS="mediaplayerse"; PASS="mediaplayerse"
            echo "Using the signing key kept (locked) in keys/."
          else
            mkdir -p ~/android-key
            KS=~/android-key/release.keystore; ALIAS="mediaplayerse"; PASS="mediaplayerse"
            if [ ! -f "$KS" ]; then
              keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass "$PASS" -keypass "$PASS" -dname "CN=Media Player (Sauce Edition), O=uberwulf, C=US"
              echo "::warning::Made a new signing key. Phones with an older copy must uninstall it before installing this one."
            else
              echo "Using the cached signing key."
            fi
          fi
          { echo "MP_KEYSTORE=$KS"; echo "MP_KEY_ALIAS=$ALIAS"; echo "MP_KEY_PASS=$PASS"; } >> "$GITHUB_ENV"

      - name: Run the checks and build the release .apk
        working-directory: android
        run: ./gradlew testReleaseUnitTest lintDebug assembleRelease --no-daemon

      - name: Sign it
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$MP_KEYSTORE" --ks-key-alias "$MP_KEY_ALIAS" \
            --ks-pass env:MP_KEY_PASS --key-pass env:MP_KEY_PASS \
            --out MediaPlayerSE-android.apk aligned.apk
          "$BT/apksigner" verify --print-certs MediaPlayerSE-android.apk | tee certs.txt | head -5
          if grep -qi "Android Debug" certs.txt; then echo "::error::Still signed with a debug key."; exit 1; fi
          "$BT/aapt2" dump badging MediaPlayerSE-android.apk | head -1
          ls -la MediaPlayerSE-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: MediaPlayerSE-android.apk
