# Runs the checks on every push and pull request, and builds a debug .apk and the Windows app folder for quick
# testing (download them from the run's Artifacts). Don't publish those: use the Release workflow.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - name: Checks, lint and a debug .apk
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      # Debug-signed, for testing only: SauceStore releases are signed with the permanent key by release.yml.
      - uses: actions/upload-artifact@v4
        with:
          name: MediaPlayerSE-android-debug-apk-for-testing
          path: android/app/build/outputs/apk/debug/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Run the checks
        run: dotnet run --project tests\MediaPlayerSE.Tests -c Release
      - name: Build the Windows app
        run: dotnet publish src\MediaPlayerSauce\MediaPlayerSauce.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=none -o build\MediaPlayerSE
      # Unsigned, for testing only: release.yml makes the SauceStore release.
      - uses: actions/upload-artifact@v4
        with:
          name: MediaPlayerSE-windows-for-testing
          path: build/MediaPlayerSE/
